name: to_gnucash

on: push

jobs:
  code_analysis:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v6

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Setup uv
      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      # Setup .venv
      - name: Setup .venv
        run: uv sync

      # Mypy
      - name: Mypy
        run: uv run mypy to_gnucash.py accountancy

      # Pylint
      - name: Pylint
        run: uv run pylint to_gnucash.py accountancy

      # Black
      - name: Black
        run: uv run black --check to_gnucash.py accountancy

      # isort
      - name: isort
        run: uv run isort --check to_gnucash.py accountancy
